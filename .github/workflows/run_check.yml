name: Check CROUS Housing

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

concurrency:
  group: crous-housing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the housing check script
        env:
          BREVO_LOGIN: ${{ secrets.BREVO_LOGIN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FRIEND_TO_EMAIL: ${{ secrets.FRIEND_TO_EMAIL }}
          CROUS_COOKIES_API_URL: ${{ secrets.CROUS_COOKIES_API_URL }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import requests

          api_url = os.environ.get("CROUS_COOKIES_API_URL", "").strip()
          payload = {"cookies": []}

          if api_url:
              try:
                  response = requests.get(
                      api_url,
                      headers={"Accept": "application/json"},
                      timeout=20,
                  )
                  response.raise_for_status()
                  candidate = response.json()
                  cookies = candidate.get("cookies", []) if isinstance(candidate, dict) else candidate
                  if isinstance(cookies, list):
                      payload = {"cookies": cookies}
                      print(f"Loaded {len(cookies)} CROUS cookie(s) from the dashboard API.")
                  else:
                      print("Dashboard API returned an invalid cookie collection; using public access.")
              except (requests.RequestException, ValueError):
                  print("Could not retrieve CROUS cookies from the dashboard API; using public access.")
          else:
              print("CROUS_COOKIES_API_URL is not configured; using public access.")

          Path("cookies.json").write_text(json.dumps(payload), encoding="utf-8")
          PY

          AUTH_USER=$(python - <<'PY'
          import json
          import requests

          from crous_notifier import BASE_URL, DEFAULT_TIMEOUT_SECONDS, HEADERS

          session = requests.Session()
          session.headers.update(HEADERS)

          try:
              payload = json.loads(open("cookies.json", encoding="utf-8").read())
              cookies = payload.get("cookies", []) if isinstance(payload, dict) else payload
              for cookie in cookies if isinstance(cookies, list) else []:
                  if not isinstance(cookie, dict) or not cookie.get("name"):
                      continue
                  session.cookies.set(
                      str(cookie["name"]),
                      str(cookie.get("value", "")),
                      domain=str(cookie.get("domain") or "trouverunlogement.lescrous.fr"),
                      path=str(cookie.get("path") or "/"),
                  )

              response = session.get(f"{BASE_URL}/api/fr/user", timeout=DEFAULT_TIMEOUT_SECONDS)
              response.raise_for_status()
              data = response.json()
              identity = data.get("identity", {}) if isinstance(data, dict) else {}
              name = f"{identity.get('firstName', '')} {identity.get('lastName', '')}".strip()
              print(name)
          except Exception:
              print("")
          PY
          )

          python crous_notifier.py | while IFS= read -r line; do
            if [[ "$line" == "CROUS SCRAPING STATUS: AUTHENTICATED" && -n "$AUTH_USER" ]]; then
              echo "$line — $AUTH_USER"
            else
              echo "$line"
            fi
          done

          rm -f cookies.json

      - name: Commit and push state files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          mkdir -p data
          git add --all -- data
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update CROUS state files"
            git push
          fi
