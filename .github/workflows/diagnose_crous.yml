name: CROUS Session Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose_crous.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch cookies without exposing values
        env:
          CROUS_COOKIES_API_URL: ${{ secrets.CROUS_COOKIES_API_URL }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          import requests

          api_url = os.environ.get('CROUS_COOKIES_API_URL', '').strip()
          if not api_url:
              raise SystemExit('CROUS_COOKIES_API_URL is not configured')

          for attempt in range(1, 4):
              try:
                  response = requests.get(api_url, headers={'Accept': 'application/json'}, timeout=20)
                  response.raise_for_status()
                  payload = response.json()
                  cookies = payload.get('cookies', []) if isinstance(payload, dict) else payload
                  if not isinstance(cookies, list):
                      raise ValueError('invalid cookie collection')
                  Path('cookies.json').write_text(json.dumps({'cookies': cookies}), encoding='utf-8')
                  print(f'Loaded {len(cookies)} cookie(s) for diagnostic; values are not logged.')
                  break
              except (requests.RequestException, ValueError) as exc:
                  if attempt == 3:
                      raise SystemExit(f'Could not fetch cookies after 3 attempts: {type(exc).__name__}')
                  print(f'Cookie fetch attempt {attempt}/3 failed; retrying.')
                  time.sleep(2)
          PY

      - name: Diagnose CROUS client state
        run: python diagnose_crous_session.py

      - name: Remove temporary cookie file
        if: always()
        run: rm -f cookies.json
