name: CROUS Housing Card Matrix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose_crous_cards.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch cookies without logging values
        env:
          CROUS_COOKIES_API_URL: ${{ secrets.CROUS_COOKIES_API_URL }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          import requests

          api_url = os.environ.get('CROUS_COOKIES_API_URL', '').strip()
          if not api_url:
              raise SystemExit('CROUS_COOKIES_API_URL is not configured')

          for attempt in range(1, 4):
              try:
                  response = requests.get(api_url, headers={'Accept': 'application/json'}, timeout=20)
                  response.raise_for_status()
                  payload = response.json()
                  cookies = payload.get('cookies', []) if isinstance(payload, dict) else payload
                  if not isinstance(cookies, list):
                      raise ValueError('invalid cookie collection')
                  Path('cookies.json').write_text(json.dumps({'cookies': cookies}), encoding='utf-8')
                  print(f'Loaded {len(cookies)} cookie(s); values are not logged.')
                  break
              except (requests.RequestException, ValueError) as exc:
                  if attempt == 3:
                      raise SystemExit(f'Cookie fetch failed: {type(exc).__name__}')
                  time.sleep(2)
          PY

      - name: Run housing-card matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic
          python diagnose_crous_cards.py | tee diagnostic/crous_card_matrix.txt

      - name: Remove sensitive temporary file
        if: always()
        run: rm -f cookies.json

      - name: Commit diagnostic result
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add diagnostic/crous_card_matrix.txt
          if git diff --staged --quiet; then
            echo 'Diagnostic result unchanged.'
            exit 0
          fi
          git commit -m 'Record CROUS housing-card matrix'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
